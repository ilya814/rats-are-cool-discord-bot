
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rats are cool studio's | Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101018;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 520px;
            padding: 40px 25px;
            background: #1c1c29;
            border: 1px solid #343448;
            border-radius: 18px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: #aaaabd;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            background: #7138c8;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        .button:hover {
            background: #8955df;
        }

        .status {
            margin-top: 25px;
            font-size: 13px;
            color: #88889b;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Rats are cool studio's</h1>
        <p>Discord Bot Dashboard</p>

        <p>
            Welcome to your private management dashboard.
            Manage your community and control your custom Discord bot.
        </p>

        <a class="button" href="#">Dashboard coming soon</a>

        <div class="status">System is under development</div>
    </main>
</body>
</html>
